name: ClawTalk
options:
  bundleIdPrefix: com.openclaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: X5G6AN3DYX
    CODE_SIGN_IDENTITY: "iPhone Distribution"
    CODE_SIGN_STYLE: Manual
    ENABLE_PREVIEWS: YES

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: "2.4.0"

targets:
  ClawTalk:
    type: application
    platform: iOS
    sources:
      - ClawTalk
    resources:
      - ClawTalk/Resources
    dependencies:
      - package: KeychainAccess
      - package: MarkdownUI
      - target: ClawTalkKeyboard

  ClawTalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClawTalkTests
    dependencies:
      - target: ClawTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.tests
        GENERATE_INFOPLIST_FILE: YES

  ClawTalkKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ClawTalkKeyboard
    resources:
      - path: ClawTalkKeyboard/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.123
        PROVISIONING_PROFILE_SPECIFIER: 7517ext
        INFOPLIST_FILE: ClawTalkKeyboard/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: KEYBOARD_EXTENSION
        CODE_SIGN_ENTITLEMENTS: ClawTalkKeyboard/ClawTalkKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
