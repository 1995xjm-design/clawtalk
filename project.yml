name: ClawTalk
options:
  bundleIdPrefix: com.openclaw
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: X5G6AN3DYX
    CODE_SIGN_IDENTITY: "iPhone Distribution"
    CODE_SIGN_STYLE: Manual
    ENABLE_PREVIEWS: YES

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: "2.4.0"
  HamsterKeyboardKit:
    path: KeyboardPackages/HamsterKeyboardKit
  HamsterKit:
    path: KeyboardPackages/HamsterKit
  HamsterUIKit:
    path: KeyboardPackages/HamsterUIKit
  HamsteriOS:
    path: KeyboardPackages/HamsteriOS

targets:
  ClawTalk:
    type: application
    platform: iOS
    sources:
      - ClawTalk
      - ClawTalkShared
    resources:
      - ClawTalk/Resources
      # Rime 内置资源单独用文件夹引用打包，生成 ClawTalk.app/SharedSupport/ 目录（键盘设置页部署需要）
      - path: ClawTalk/Resources/SharedSupport
        type: folder
    dependencies:
      - package: KeychainAccess
      - package: MarkdownUI
      - package: HamsterKit
      - package: HamsterUIKit
      - package: HamsteriOS
      - target: ClawTalkWatchApp
      - target: ClawTalkKeyboard
      - target: ClawTalkWidget
      - target: ClawTalkShareExtension
    postBuildScripts:
      - name: Copy Rime SharedSupport into main app
        script: |
          set -e
          SRC="$SRCROOT/ClawTalkKeyboard/Resources/SharedSupport"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/SharedSupport"
          mkdir -p "$DST"
          cp -R "$SRC/." "$DST/"
          ls -la "$DST"
    settings:
      base:
        INFOPLIST_FILE: ClawTalk/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClawTalk/Resources/ClawTalk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517
        PROVISIONING_PROFILE_SPECIFIER: 7517
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: 7
        TARGETED_DEVICE_FAMILY: "1,2"
        KNOWN_REGIONS:
          - Base
          - en
          - zh-Hans
    info:
      path: ClawTalk/Resources/Info.plist
      properties:
        CFBundleDisplayName: ClawTalk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "ClawTalk needs microphone access for voice input to your AI agent."
        NSSpeechRecognitionUsageDescription: "ClawTalk uses speech recognition to transcribe your voice messages."
        NSUserNotificationsUsageDescription: "ClawTalk sends notifications when your AI agent needs your attention."
        NSLocationWhenInUseUsageDescription: "ClawTalk shares your location with your AI agent when requested."
        NSContactsUsageDescription: "ClawTalk accesses contacts when your AI agent needs to look up or add a contact."
        NSCalendarsFullAccessUsageDescription: "ClawTalk accesses your calendar when your AI agent needs to view or create events."
        NSRemindersFullAccessUsageDescription: "ClawTalk accesses reminders when your AI agent needs to view or create reminders."
        NSMotionUsageDescription: "ClawTalk accesses motion data when your AI agent requests activity or step information."
        NSPhotoLibraryUsageDescription: "ClawTalk accesses your photos when your AI agent requests recent images."
        NSCameraUsageDescription: "ClawTalk uses the camera when your AI agent requests a photo."
        NSAppTransportSecurity:
          # ????????? HTTP ????????18789?????18890?
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSPhotoLibraryAddUsageDescription: "用于保存微信连接二维码图片到相册"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIBackgroundModes:
          - audio
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.openclaw.clawtalk.bgrefresh
        NSHealthShareUsageDescription: ClawTalk reads health data (steps) when your AI agent needs it.
        NSLocationAlwaysAndWhenInUseUsageDescription: ClawTalk uses your location for home/leave reminders and travel.
        NSLocalNetworkUsageDescription: ClawTalk connects to your computer on the local network for file transfer and memory sync.
        NSBonjourServices:
          - _http._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.openclaw.clawtalk
            CFBundleURLSchemes:
              - clawtalk
              - hamster

  ClawTalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClawTalkTests
    dependencies:
      - target: ClawTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.tests
        GENERATE_INFOPLIST_FILE: YES

  ClawTalkKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ClawTalkKeyboard
        excludes:
          - Resources/SharedSupport/**
    resources:
      - path: ClawTalkKeyboard/Localizable.xcstrings
    postBuildScripts:
      - name: Copy Rime SharedSupport into appex
        script: |
          set -e
          SRC="$SRCROOT/ClawTalkKeyboard/Resources/SharedSupport"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/SharedSupport"
          mkdir -p "$DST"
          cp -R "$SRC/." "$DST/"
          ls -la "$DST"
    dependencies:
      - package: HamsterKeyboardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.123
        PROVISIONING_PROFILE_SPECIFIER: 7517ext
        INFOPLIST_FILE: ClawTalkKeyboard/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: KEYBOARD_EXTENSION
        CODE_SIGN_ENTITLEMENTS: ClawTalkKeyboard/ClawTalkKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        # FIX-HMSTR-004/005：-interposable 在 iOS 26 dyld 变更下导致键盘扩展加载崩溃（选了呼不出），改用 -no_fixup_chains
        OTHER_LDFLAGS: "-Xlinker -no_fixup_chains"

  ClawTalkWidget:
    type: app-extension
    platform: iOS
    sources:
      - ClawTalkWidget
      - ClawTalkShared
    dependencies:
      # 可切换卡片小组件（AppIntentConfiguration）需要 AppIntents 框架
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.widget
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: ClawTalkWidget/ClawTalkWidget.entitlements
    info:
      path: ClawTalkWidget/Info.plist
      properties:
        CFBundleDisplayName: ClawTalk Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ClawTalkShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ClawTalkShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.share
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: ClawTalkShareExtension/ClawTalkShareExtension.entitlements
    info:
      path: ClawTalkShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ClawTalk
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController

  # ---------- watchOS 手表端（配套 watch app，embedded in ClawTalk） ----------
  # XcodeGen 写法：watch app 容器用 type: com.apple.product-type.application.watchapp2（productType
  # application.watchapp2），扩展用 type: com.apple.product-type.watchkit2-extension（productType
  # watchkit2-extension）；iOS 主 App 依赖 watch2-app 会自动生成
  # "Embed Watch Content" 拷贝阶段，watch app 依赖扩展自动嵌入扩展。
  # 签名假设：沿用 app.lgm.7517 体系。watch 扩展用 app.lgm.7517.watch、
  # watch app 容器用 app.lgm.7517.watchapp；profile 暂用 7517ext 占位，
  # 正式出包前需在开发者后台给 watchOS 补描述文件（见 docs/watchos-wiring.md）。
  ClawTalkWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ClawTalkWatchApp/App
      - path: ClawTalkWatchApp/Extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.watchapp
        PROVISIONING_PROFILE_SPECIFIER: 7517ext
        CODE_SIGN_ENTITLEMENTS: ClawTalkWatchApp/ClawTalkWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: 7
    info:
      path: ClawTalkWatchApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: ClawTalk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.lgm.7517
