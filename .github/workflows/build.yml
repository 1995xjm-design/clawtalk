name: Build & Test (ClawTalk + Keyboard)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project (xcodegen)
        run: xcodegen generate

      - name: Resolve dependencies (SPM)
        if: steps.check.outputs.skip != 'true'
        run: xcodebuild -resolvePackageDependencies -project ClawTalk.xcodeproj -scheme ClawTalk

      - name: Build ClawTalk app (+ keyboard extension)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-app.log

      - name: Build ClawTalkKeyboard extension (standalone)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalkKeyboard \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-keyboard.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      - name: Build device .app (unsigned, for sideloading)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO | tee build-device.log

      - name: Package .ipa (unsigned)
        run: |
          set -o pipefail
          APP_PATH=$(find build-dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          # 确认键盘扩展已嵌入
          ls "$APP_PATH/PlugIns" 2>/dev/null || echo "!! 未找到 PlugIns 目录"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ClawTalk-unsigned.ipa Payload/
          ls -lh ClawTalk-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawtalk-unsigned-ipa
          path: ClawTalk-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-app.log
            build-keyboard.log
            test.log
  # 真签名打包：直接对 unsigned ipa 用 codesign 签名（p12 + 主/扩展两张描述文件）
  # Secrets 必填：P12_BASE64 / P12_PASSWORD / PROFILE_MAIN_B64 / PROFILE_EXT_B64
  sign:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: check
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
        run: |
          if [ -z "$P12_B64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured - skipping sign job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download unsigned ipa
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: clawtalk-unsigned-ipa
          path: unsigned-art

      - name: Install signing assets
        if: steps.check.outputs.skip != 'true'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
        run: |
          set -e
          mkdir -p profiles
          echo "$P12_B64" | base64 --decode > sign.p12
          echo "$MAIN_PROFILE_B64" | base64 --decode > profiles/main.mobileprovision
          echo "$EXT_PROFILE_B64" | base64 --decode > profiles/ext.mobileprovision
          ls -la sign.p12 profiles/

      - name: Sign ipa (app + keyboard extension)
        if: steps.check.outputs.skip != 'true'
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p build
          python3 scripts/sign_ipa.py \
            --ipa unsigned-art/clawtalk-unsigned-ipa.zip \
            --p12 sign.p12 \
            --password "$P12_PASSWORD" \
            --main-profile profiles/main.mobileprovision \
            --ext-profile profiles/ext.mobileprovision \
            --out build/ClawTalk-signed.ipa | tee sign.log
          ls -lh build/ClawTalk-signed.ipa

      - name: Upload signed .ipa artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clawtalk-signed-ipa
          path: build/ClawTalk-signed.ipa
          if-no-files-found: error

      - name: Upload signing logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: sign.log
          if-no-files-found: ignore
