name: Build & Test (ClawTalk + Keyboard)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project (xcodegen)
        run: xcodegen generate

      - name: Resolve dependencies (SPM)
        if: steps.check.outputs.skip != 'true'
        run: xcodebuild -resolvePackageDependencies -project ClawTalk.xcodeproj -scheme ClawTalk

      - name: Build ClawTalk app (+ keyboard extension)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-app.log

      - name: Build ClawTalkKeyboard extension (standalone)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalkKeyboard \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-keyboard.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      - name: Build device .app (unsigned, for sideloading)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO | tee build-device.log

      - name: Package .ipa (unsigned)
        run: |
          set -o pipefail
          APP_PATH=$(find build-dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          # 确认键盘扩展已嵌入
          ls "$APP_PATH/PlugIns" 2>/dev/null || echo "!! 未找到 PlugIns 目录"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ClawTalk-unsigned.ipa Payload/
          ls -lh ClawTalk-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawtalk-unsigned-ipa
          path: ClawTalk-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-app.log
            build-keyboard.log
            test.log

  # 真签名打包（第三方 P12 + 两张描述文件，Xcode 原生签名，键盘扩展不会漏）
  # Secrets 必填：P12_BASE64 / P12_PASSWORD / PROFILE_MAIN_B64 / PROFILE_EXT_B64
  # 使用：GitHub Actions -> Build & Test -> Run workflow（或 push main 自动跑）
  sign:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project (xcodegen)
        run: xcodegen generate

      - name: Check signing secrets
        id: check
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
        run: |
          if [ -z "$P12_B64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured - skipping sign job"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install signing assets (p12 + profiles)
        if: steps.check.outputs.skip != 'true'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
        run: |
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$MAIN_PROFILE_B64" | base64 --decode > "$PROFILE_DIR/7517.mobileprovision"
          echo "$EXT_PROFILE_B64"  | base64 --decode > "$PROFILE_DIR/7517ext.mobileprovision"
          echo "$P12_B64" | base64 --decode > /tmp/sign.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import /tmp/sign.p12 -k ci.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci ci.keychain
          echo "signing assets installed"

      - name: Resolve dependencies (SPM)
        if: steps.check.outputs.skip != 'true'
        run: xcodebuild -resolvePackageDependencies -project ClawTalk.xcodeproj -scheme ClawTalk

      - name: Archive (signed)
        if: steps.check.outputs.skip != 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClawTalk.xcarchive | tee archive.log

      - name: Export signed .ipa
        if: steps.check.outputs.skip != 'true'
        run: |
          set -o pipefail
          cat > exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>X5G6AN3DYX</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.lgm.7517</key>
                  <string>7517</string>
                  <key>app.lgm.7517.123</key>
                  <string>7517ext</string>
              </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ClawTalk.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export | tee export.log
          ls -lh build/export/*.ipa

      - name: Upload signed .ipa artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clawtalk-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload signing logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: |
            archive.log
            export.log
