name: Build & Test (ClawTalk + Keyboard)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project (xcodegen)
        run: xcodegen generate

      - name: Resolve dependencies (SPM)
        run: xcodebuild -resolvePackageDependencies -project ClawTalk.xcodeproj -scheme ClawTalk

      - name: Build ClawTalk app (+ keyboard extension)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-app.log

      - name: Build ClawTalkKeyboard extension (standalone)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalkKeyboard \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build-keyboard.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      - name: Build device .app (unsigned, for sideloading)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO | tee build-device.log

      - name: Package .ipa (unsigned)
        run: |
          set -o pipefail
          APP_PATH=$(find build-dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          # 确认键盘扩展已嵌入
          ls "$APP_PATH/PlugIns" 2>/dev/null || echo "!! 未找到 PlugIns 目录"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ClawTalk-unsigned.ipa Payload/
          ls -lh ClawTalk-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawtalk-unsigned-ipa
          path: ClawTalk-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-app.log
            build-keyboard.log
            test.log

  # 真签名打包（需要开发者账号，配置见 outputs/FUSION-011-开发者账号签名指南.md）
  # Secrets 必填：TEAM_ID / APPSTORE_KEY_ID / APPSTORE_ISSUER_ID / APPSTORE_API_KEY_P8
  # 首次使用前：在 developer.apple.com -> Devices 注册你的 iPhone UDID
  sign:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project (xcodegen)
        run: xcodegen generate

      - name: Install App Store Connect API Key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPSTORE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          echo "API key installed: ${APPSTORE_KEY_ID}"

      - name: Resolve dependencies (SPM)
        run: xcodebuild -resolvePackageDependencies -project ClawTalk.xcodeproj -scheme ClawTalk

      - name: Archive (signed with developer account)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ClawTalk.xcodeproj \
            -scheme ClawTalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClawTalk.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=$TEAM_ID | tee archive.log

      - name: Export signed .ipa
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ClawTalk.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=$TEAM_ID | tee export.log
          ls -lh build/export/*.ipa

      - name: Upload signed .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawtalk-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload signing logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signing-logs
          path: |
            archive.log
            export.log
